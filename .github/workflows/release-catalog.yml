name: Release signed catalog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed catalog version
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: pixel-autopif-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: catalog-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: >-
          python scripts/validate_coverage.py
          --templates templates/pixel-devices.json
          --verified data/verified-candidates.json
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}"; then
            echo "Tag v${{ inputs.version }} already exists." >&2
            exit 1
          fi
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ inputs.version }} already exists." >&2
            exit 1
          fi
      - run: >-
          python scripts/build_catalog.py
          --templates templates/pixel-devices.json
          --verified data/verified-candidates.json
          --output dist
          --version ${{ inputs.version }}
      - run: >-
          python scripts/validate_catalog.py
          --catalog dist/pixel-catalog-v${{ inputs.version }}.json
          --schema schemas/pixel-catalog.schema.json
      - run: >-
          python scripts/build_manifest.py
          --catalog dist/pixel-catalog-v${{ inputs.version }}.json
          --output dist/pixel-catalog.manifest.json
          --key-id pixel-autopif-p256-v1
      - name: Sign exact bytes
        env:
          CATALOG_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.CATALOG_SIGNING_KEY_PKCS8_BASE64 }}
        run: >-
          python scripts/sign_catalog.py
          dist/pixel-catalog-v${{ inputs.version }}.json
          dist/pixel-catalog.manifest.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}"
          dist/*
          --target "${GITHUB_SHA}"
          --latest
          --title "Pixel catalog v${{ inputs.version }}"
          --notes "Reviewed, exact-byte signed Pixel AutoPIF catalog."
