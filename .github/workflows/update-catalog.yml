name: Update catalog review

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pixel-autopif-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: mkdir review-data review-dist
      - run: >-
          python scripts/refresh_candidates.py
          --templates templates/pixel-devices.json
          --existing data/verified-candidates.json
          --output review-data/verified-candidates.json
          --dispositions review-data/candidate-dispositions.json
      - run: >-
          python scripts/build_catalog.py
          --templates templates/pixel-devices.json
          --verified review-data/verified-candidates.json
          --output review-dist
          --previous catalog/pixel-catalog-current.json
      - run: >-
          python scripts/validate_catalog.py
          --catalog review-dist/pixel-catalog-v1.json
          --schema schemas/pixel-catalog.schema.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-catalog-review
          path: |
            review-data/
            review-dist/
          if-no-files-found: error

  open-review-pr:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-catalog-review
          path: review
      - name: Prepare deterministic review diff
        run: |
          cp review/review-data/verified-candidates.json data/verified-candidates.json
          cp review/review-dist/pixel-catalog-v*.json catalog/pixel-catalog-current.json
          git diff --exit-code && echo "changed=false" >> "$GITHUB_ENV" || echo "changed=true" >> "$GITHUB_ENV"
      - name: Push fixed automation branch
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/pixel-catalog-update
          git add data/verified-candidates.json catalog/pixel-catalog-current.json
          git commit -m "chore(catalog): refresh verified Pixel builds"
          git push --force-with-lease origin automation/pixel-catalog-update
          gh pr create \
            --base main \
            --head automation/pixel-catalog-update \
            --title "chore(catalog): refresh verified Pixel builds" \
            --body "Automated discovery only. Review official OTA URLs, hashes, tuple extraction, dispositions artifact, and newest-three rotation before merge." \
            || gh pr edit automation/pixel-catalog-update \
              --title "chore(catalog): refresh verified Pixel builds" \
              --body "Automated discovery only. Review official OTA URLs, hashes, tuple extraction, dispositions artifact, and newest-three rotation before merge."
