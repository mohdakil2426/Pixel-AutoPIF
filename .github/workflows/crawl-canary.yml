name: Crawl Pixel canary data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pif-canary-crawl
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Prepare automation branch
        shell: bash
        env:
          UPDATE_BRANCH: automation/pif-canary-update
        run: |
          git fetch --no-tags origin main
          if git ls-remote --exit-code origin "refs/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$UPDATE_BRANCH"
            git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create "$UPDATE_BRANCH" origin/main
          fi

      - name: Crawl canary data
        run: bash scripts/crawl-canary.sh --output data/pif-canary.json

      - name: Validate canary data
        run: bash scripts/validate-canary.sh data/pif-canary.json

      - name: Open data update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/pif-canary-update
        run: |
          if git diff --quiet -- data/pif-canary.json; then
            echo "canary data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pif-canary.json
          git commit -m "chore(pif-crawler): refresh canary data"
          git push origin "HEAD:$UPDATE_BRANCH"

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -z $pr_number ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore(pif-crawler): refresh canary data" \
              --body "Automated canary crawl update. Review the four-field data diff, then merge after the producer check passes."
          else
            echo "updated existing pull request #$pr_number"
          fi

          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"
