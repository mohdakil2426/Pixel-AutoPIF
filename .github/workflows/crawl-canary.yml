name: Crawl Pixel canary data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: pif-canary-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Crawl canary data
        run: bash scripts/crawl-canary.sh --output data/pif-canary.json

      - name: Validate canary data
        run: bash scripts/validate-canary.sh data/pif-canary.json

      - name: Commit changed data
        shell: bash
        run: |
          git add data/pif-canary.json
          if git diff --cached --quiet -- data/pif-canary.json; then
            echo "canary data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pif-crawler): refresh canary data"
          git push origin HEAD:main
